<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fabric Catalog | Maximo Tekstil</title>
<meta name="description" content="Browse 200+ premium technical fabrics. Workwear, flame-retardant, high-visibility, CORDURA®, and specialty textiles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A44;
  --ink-2:#2E3D5E;
  --paper:#FBFBF9;
  --warp:#F5F5F2;
  --line:#E0E2E6;
  --muted:#6B7280;
  --signal:#F26B1D;
  --khaki:#8C7B5A;
  --font:"Archivo", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px}

/* Header */
header{position:sticky;top:0;z-index:10;background:rgba(251,251,249,.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:72px;display:flex;align-items:center}
header .wrap{display:flex;align-items:center;justify-content:space-between;width:100%}
.logo{font-weight:800;font-size:20px;letter-spacing:-.01em;text-decoration:none;font-variation-settings:"wdth" 112;display:flex;align-items:center}
.logo span{font-weight:400;color:var(--muted);margin-left:6px}
.header-nav a{font-size:14px;font-weight:600;color:var(--muted);margin:0 16px;display:inline-flex;align-items:center;height:44px}
.header-nav a:hover{color:var(--signal)}
.back-btn{font-size:14px;font-weight:600;color:var(--signal);margin-right:auto}

/* Page Header */
.page-head{padding:40px 0;border-bottom:1px solid var(--line)}
.page-head h1{margin:0;font-size:clamp(32px,5vw,48px);font-weight:800;letter-spacing:-.02em;font-variation-settings:"wdth" 72}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:16px}

/* Filters & Controls */
.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;margin:32px 0;padding:24px;background:#fff;border:1px solid var(--line);border-radius:4px}
.control-group label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.control-group input,.control-group select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:3px;font-family:inherit;font-size:15px;color:var(--ink)}
.control-group input:focus,.control-group select:focus{border-color:var(--ink);outline:none}

.filter-tags{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.filter-tag{font-size:13px;padding:6px 12px;background:var(--warp);border-radius:20px;color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:all .2s}
.filter-tag:hover{background:var(--line)}
.filter-tag button{background:none;border:none;cursor:pointer;color:var(--muted);font-weight:bold;padding:0;font-size:14px}

/* Products Grid */
.products-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin:32px 0}

.product-card{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:all .3s cubic-bezier(.16,1,.3,1);height:100%}
.product-card:hover{border-color:var(--ink);box-shadow:0 12px 32px rgba(30,42,68,.12);transform:translateY(-4px)}

.product-image{aspect-ratio:3/4;background:#e8e8e8;position:relative;overflow:hidden}
.product-image svg{width:100%;height:100%}
.product-image img{width:100%;height:100%;object-fit:cover}

.product-info{padding:16px;display:flex;flex-direction:column;flex:1}
.product-category{font-size:11px;font-weight:700;color:var(--signal);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.product-name{margin:0 0 8px;font-size:18px;font-weight:800;letter-spacing:-.005em;line-height:1.2;color:var(--ink);font-variation-settings:"wdth" 80}

.product-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;font-size:13px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.spec-item{display:flex;flex-direction:column}
.spec-label{color:var(--muted);font-weight:600;font-size:11px}
.spec-value{color:var(--ink);font-weight:700;font-size:14px;margin-top:2px}

.product-desc{font-size:13px;color:var(--ink-2);margin:10px 0 0;flex:1;line-height:1.6}

.product-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.product-actions a{flex:1;padding:8px 12px;border:1.5px solid var(--line);border-radius:3px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;display:inline-flex;align-items:center;justify-content:center}
.product-actions a:hover{border-color:var(--signal);color:var(--signal);background:rgba(242,107,29,.05)}
.product-actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.product-actions .primary:hover{background:var(--signal);border-color:var(--signal)}

/* Result Stats */
.result-info{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:14px;color:var(--muted)}
.result-count{font-weight:700;color:var(--ink)}

/* Responsive */
@media (max-width:1200px){
  .products-container{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
}
@media (max-width:768px){
  .controls{grid-template-columns:1fr 1fr;gap:12px}
  .products-container{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .product-info{padding:12px}
  .product-name{font-size:16px}
}
@media (max-width:640px){
  header .header-nav{display:none}
  .controls{grid-template-columns:1fr}
  .products-container{grid-template-columns:repeat(2,1fr);gap:10px}
  .product-image{aspect-ratio:2/3}
  .product-info{padding:10px}
  .product-name{font-size:14px}
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="wrap">
    <a href="/" class="logo">Maximo<span>Tekstil</span></a>
    <nav class="header-nav">
      <a href="/">← Back to Home</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<!-- Page Header -->
<div class="wrap">
  <section class="page-head">
    <h1>Fabric Catalog</h1>
    <p>200+ premium technical fabrics ready to ship from our EU warehouse</p>
  </section>

  <!-- Filters -->
  <div class="controls">
    <div class="control-group">
      <label>Search</label>
      <input type="text" placeholder="Search fabrics..." id="search">
    </div>
    <div class="control-group">
      <label>Category</label>
      <select id="category">
        <option value="">All Categories</option>
        <option value="workwear">Workwear</option>
        <option value="fire">Flame-Retardant</option>
        <option value="visibility">High-Visibility</option>
        <option value="cordura">CORDURA®</option>
        <option value="medical">Medical</option>
      </select>
    </div>
    <div class="control-group">
      <label>Weight Range</label>
      <select id="weight">
        <option value="">All Weights</option>
        <option value="light">Light (< 200g)</option>
        <option value="medium">Medium (200-300g)</option>
        <option value="heavy">Heavy (> 300g)</option>
      </select>
    </div>
    <div class="control-group">
      <label>Composition</label>
      <select id="composition">
        <option value="">All Compositions</option>
        <option value="cotton">100% Cotton</option>
        <option value="blend">Cotton Blend</option>
        <option value="synthetic">Synthetic</option>
      </select>
    </div>
  </div>

  <div class="filter-tags" id="filterTags"></div>

  <!-- Results -->
  <div class="result-info">
    <span>Showing <span class="result-count">12</span> fabrics</span>
    <span>
      <select id="sort" style="border:1px solid var(--line);padding:6px;border-radius:3px;font-size:13px;background:#fff">
        <option value="popular">Most Popular</option>
        <option value="name-asc">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
        <option value="weight-asc">Lightest First</option>
        <option value="weight-desc">Heaviest First</option>
      </select>
    </span>
  </div>

  <!-- Products Grid -->
  <div class="products-container" id="productsGrid">
    <!-- Cards will be generated here -->
  </div>
</div>

<script>
// Sample fabric data (in production, this would come from an API)
const fabrics = [
  {id:1,name:"Canvas Pro",category:"workwear",weight:"320 gsm",composition:"100% Cotton",desc:"Durable heavy-duty canvas for industrial workwear"},
  {id:2,name:"Hi-Vis Signal",category:"visibility",weight:"200 gsm",composition:"67% CO / 33% PES",desc:"EN 20471 compliant high-visibility fabric"},
  {id:3,name:"CORDURA Elite",category:"cordura",weight:"320 gsm",composition:"100% CORDURA®",desc:"Ultra-durable nylon for outdoor gear"},
  {id:4,name:"Fire Shield",category:"fire",weight:"280 gsm",composition:"Blend",desc:"Flame-retardant protection fabric"},
  {id:5,name:"Medical Grade",category:"medical",weight:"150 gsm",composition:"100% Cotton",desc:"Soft, breathable medical textile"},
  {id:6,name:"Workwear Premium",category:"workwear",weight:"260 gsm",composition:"Blend",desc:"Professional-grade workwear fabric"},
  {id:7,name:"Safety Orange",category:"visibility",weight:"210 gsm",composition:"Cotton Blend",desc:"Bright orange high-visibility solution"},
  {id:8,name:"Tactical Ripstop",category:"cordura",weight:"300 gsm",composition:"Ripstop Nylon",desc:"Lightweight tactical fabric with ripstop grid"},
  {id:9,name:"Comfort Twill",category:"workwear",weight:"240 gsm",composition:"68% CO / 32% PES",desc:"Soft, comfortable everyday workwear"},
  {id:10,name:"FR Denim",category:"fire",weight:"310 gsm",composition:"Flame-Treated",desc:"Classic denim with flame-retardant treatment"},
  {id:11,name:"Anti-Static Canvas",category:"workwear",weight:"290 gsm",composition:"Special Blend",desc:"ESD-safe canvas for electronics manufacturing"},
  {id:12,name:"Outdoor Performance",category:"cordura",weight:"270 gsm",composition:"CORDURA® Blend",desc:"Weather-resistant outdoor technical fabric"}
];

const colors = {
  workwear:"#5E6B5A",
  fire:"#D84315",
  visibility:"#F26B1D",
  cordura:"#26324F",
  medical:"#E6E8EB"
};

function generateFabricCard(fabric){
  const color = colors[fabric.category] || "#8C7B5A";
  return `
    <div class="product-card">
      <div class="product-image">
        <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
          <rect fill="${color}" width="300" height="400"/>
          <pattern id="p${fabric.id}" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="6" y2="6" stroke="rgba(255,255,255,.1)" stroke-width="0.5"/>
          </pattern>
          <rect fill="url(#p${fabric.id})" width="300" height="400"/>
        </svg>
      </div>
      <div class="product-info">
        <div class="product-category">${fabric.category}</div>
        <h3 class="product-name">${fabric.name}</h3>
        <div class="product-specs">
          <div class="spec-item">
            <span class="spec-label">Weight</span>
            <span class="spec-value">${fabric.weight}</span>
          </div>
          <div class="spec-item">
            <span class="spec-label">Composition</span>
            <span class="spec-value">${fabric.composition}</span>
          </div>
        </div>
        <p class="product-desc">${fabric.desc}</p>
        <div class="product-actions">
          <a href="#" class="primary">View Details</a>
          <a href="#contact">Request Sample</a>
        </div>
      </div>
    </div>
  `;
}

function renderFabrics(items){
  document.getElementById("productsGrid").innerHTML = items.map(f => generateFabricCard(f)).join("");
  document.querySelector(".result-count").textContent = items.length;
}

// Initial render
renderFabrics(fabrics.slice(0, 12));

// Filter listeners
document.getElementById("search").addEventListener("input", () => applyFilters());
document.getElementById("category").addEventListener("change", () => applyFilters());
document.getElementById("weight").addEventListener("change", () => applyFilters());
document.getElementById("composition").addEventListener("change", () => applyFilters());
document.getElementById("sort").addEventListener("change", () => applyFilters());

function applyFilters(){
  let filtered = [...fabrics];

  const search = document.getElementById("search").value.toLowerCase();
  const category = document.getElementById("category").value;
  const weight = document.getElementById("weight").value;

  if(search) filtered = filtered.filter(f => f.name.toLowerCase().includes(search));
  if(category) filtered = filtered.filter(f => f.category === category);

  const sort = document.getElementById("sort").value;
  if(sort === "name-asc") filtered.sort((a,b) => a.name.localeCompare(b.name));
  if(sort === "name-desc") filtered.sort((a,b) => b.name.localeCompare(a.name));

  renderFabrics(filtered);
}
</script>

</body>
</html>
